# PPO 训练配置 - ROBOTAC 数字仿真挑战赛

# 训练参数
total_timesteps: 400000
learning_rate: 3.0e-4
n_steps: 2048       # 更大的rollout buffer
batch_size: 256     # RTX 4060 Laptop (8GB) 可用更大batch
n_epochs: 10        # 更多epoch
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2

# 环境参数
map_config:
  generate_type: "big_block_num"
  generate_config: 3
  lane_width: 4
  lane_num: 1

env_config:
  use_render: false
  manual_control: false
  traffic_density: 0.0
  num_scenarios: 10000
  random_agent_model: false
  on_continuous_line_done: true
  out_of_route_done: true
  image_observation: true
  sensors:
    rgb_camera: [320, 180]  # 提升分辨率以生成更清晰的GIF
  vehic
    show_lidar: false
    show_navi_mark: false
    show_line_to_navi_mark: false
    image_source: "rgb_camera"
  norm_pixel: false  # 保持uint8格式

# 训练参数 - RTX 4060 优化
n_envs: 1           # Windows 上 SubprocVecEnv 与 MetaDrive 有兼容性问题
seed: 42

# 路径配置
log_dir: "./logs/ppo_metadrive"
model_dir: "./models"
model_name: "ppo_metadrive.zip"

# 延迟配置
latency_threshold_ms: 100
